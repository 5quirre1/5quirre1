<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy birthdayu names!!!</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-image: url("park.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
        #frame
        {
            opacity: 0.3;
            position: fixed;
            right: 550px;
            top: 255px;
            width: 240px;
            height: auto;
        }
        #tina
        {
            position: fixed;
            left: 50px;
            bottom: 520px;
            width: 300px;
            height: auto;
        }
        #jb
        {
            position: fixed;
            left: 0px;
            bottom: 0px;
            width: 300px;
            height: auto;
        }
        #wish
        {
            position: fixed;
            left: 199px;
            bottom: 0;
            width: 300px;
            height: auto;
        }
        #hyper
        {
            z-index: 0;
            position: fixed;
            left: 500px;
            bottom: -20px;
            width: 300px;
            height: auto;
        }
        #novek
        {
            z-index: 666;
            transform: scaleX(-1);
            position: fixed;
            left: 450px;
            bottom: -20px;
            width: 300px;
            height: auto;
        }
        #cakeNames {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 30em;
            height: auto;
            z-index: 1;
        }

        #cake {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20em;
            height: auto;
            z-index: 1;
        }

        #squirrel {
            position: fixed;
            right: 480px;
            bottom: 0;
            width: 220px;
            height: auto;
            z-index: 3;
        }
        #noah
        {
            position: fixed;
            right: 680px;
            bottom: -4px;
            width: 150px;
            height: auto;
            z-index: 3;
        }
        #noma {
            position: fixed;
            right: 230px;
            bottom: -50px;
            width: 350px;
            height: auto;
            z-index: 35;
        }
        #vamp
        {
            position: fixed;
            right: 120px;
            bottom: -50px;
            width: 350px;
            height: auto;
        }
        #mpax
        {
            transform: scaleX(-1);
            position: fixed;
            right: 5px;
            bottom: -50px;
            width: 350px;
            height: auto;
            z-index: 3;
        }
        .happybirthday
        {
            text-align: center;
            z-index: 454444;
            position: absolute;
            color: white;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <h1 class="happybirthday">happy birthday names from all of us!!!</h1>
    <p style="top: 55px" class="happybirthday">hope you enjoy your birthday!!!</p>
    <img id="frame" src="frame.png">
    <img id="hyper" src="hyper.png">
    <img id="novek" src="novek.png">
    <img id="jb" src="jb.png">
    <img id="tina" src="tina.png">
    <img id="wish" src="wish.png">
    <img id="cakeNames" src="names.png" alt="Names">
    <img id="cake" src="cake.png" alt="Cake">
    <img id="noah" src="noah.png">
    <img id="squirrel" src="squirrel.png" alt="Squirrel">
    <img id="vamp" src="vamp.png">
    <img id="noma" src="noma.png">
    <img id="mpax" src="mpax.png">
    <audio id="d" src="happybirthdaynames.mp3" loop autoplay></audio>
    <script>
    const music = document.getElementById("d");

    music.play().catch(() => {
        document.addEventListener("click", () => {
            music.play();
        }, { once: true });
    });
    </script>
</body>
</html>
